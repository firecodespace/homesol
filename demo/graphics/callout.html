<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  /* Draws attention to one part of the real UI: a soft amber ring and a short label beside it. */
  .ring { position: absolute; border: 4px solid #facc15; border-radius: 18px;
          box-shadow: 0 0 0 9999px rgba(10, 7, 4, var(--dim, 0)), 0 0 28px rgba(250, 204, 21, .55); }
  .label { position: absolute; background: #facc15; color: #211a13; font-size: 26px; font-weight: 500;
           padding: 10px 20px 11px; border-radius: 999px; white-space: nowrap; box-shadow: 0 6px 22px rgba(0,0,0,.3); }
</style>
</head>
<body class="clear">
<div class="ring"></div><div class="label"></div>
<script type="module">
  import { anim, ready, params } from "./lib.js";
  const D = params.duration ?? 4;
  const [x, y, w, h] = params.rect ?? [700, 300, 500, 300];
  const pad = params.pad ?? 10;
  const ring = document.querySelector(".ring");
  Object.assign(ring.style, { left: x - pad + "px", top: y - pad + "px", width: w + 2 * pad + "px", height: h + 2 * pad + "px" });
  const label = document.querySelector(".label");
  if (params.label) {
    label.textContent = params.label;
    if (params.side === "left") {
      // Beside the ring, on its left, centred on it.
      Object.assign(label.style, { right: 1920 - (x - pad - 16) + "px", top: (params.labelTop ?? y + h / 2 - 26) + "px" });
    } else {
      // Label above the ring unless that would leave the frame.
      const above = y - pad - 64 > 20;
      Object.assign(label.style, { left: x - pad + "px", top: (above ? y - pad - 62 : y + h + pad + 14) + "px" });
    }
  } else label.remove();
  const dim = params.dim ?? 0.38;
  anim(ring, [[0.0, { o: 0, s: 1.06, "--dim": 0 }], [0.55, { o: 1, s: 1, "--dim": dim }], [D - 0.45, { o: 1, "--dim": dim }], [D, { o: 0, "--dim": 0 }]]);
  if (params.label) anim(label, [[0.25, { o: 0, y: 10 }], [0.8, { o: 1, y: 0 }], [D - 0.45, { o: 1 }], [D, { o: 0 }]]);
  ready(D);
</script>
</body>
</html>
